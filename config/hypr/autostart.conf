# Only start things that work without extra config.
exec-once = systemctl --user start hyprpolkitagent
exec-once = waybar
exec-once = hyprpaper -c ~/.config/ai-os/theme/hyprpaper.conf
exec-once = hypridle
exec-once = ai-os-power watch
# Monitor hotplug: register new screens with a sensible scale; never leave every screen off
exec-once = ai-os-display watch
exec-once = mako
exec-once = swayosd-server
exec-once = nm-applet --indicator
exec-once = wl-paste --type text --watch cliphist store
exec-once = wl-paste --type image --watch cliphist store
