# Only start things that work without extra config.
exec-once = systemctl --user start hyprpolkitagent
exec-once = waybar
exec-once = hyprpaper -c ~/.config/ai-os/theme/hyprpaper.conf
exec-once = hypridle
exec-once = ai-os-power watch
# Monitor hotplug: register new screens with a sensible scale; never leave every screen off
exec-once = ai-os-display watch
exec-once = mako
exec-once = swayosd-server
exec-once = nm-applet --indicator
# Bluetooth: connect trusted devices at login (BlueZ only reconnects after a dropped link, not at boot).
# The delay lets WirePlumber register its audio endpoints first.
# After the connect step, a USB audio sink (when present) becomes the default output again,
# so a DAC wired over USB wins over its own Bluetooth link. Bluetooth stays selectable by hand.
exec-once = sh -c 'sleep 5; bluetoothctl devices Trusted | cut -d" " -f2 | xargs -rn1 timeout 20 bluetoothctl connect; pactl list short sinks | cut -f2 | grep -m1 "^alsa_output\.usb-" | xargs -r pactl set-default-sink'
exec-once = wl-paste --type text --watch cliphist store
exec-once = wl-paste --type image --watch cliphist store
