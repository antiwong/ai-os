# ai-os base Hyprland config (Hyprland 0.53, hyprlang). Omarchy-style: keyboard-first, Catppuccin Mocha + mauve.
# Split into modules so each bead task owns one file.
# Files under ~/.config/ai-os/ are generated (ai-os-theme, ai-os-display, ai-os-power) and seeded empty by
# scripts/05-link-dotfiles.sh, because hyprlang treats a missing source file as a config error.
source = ~/.config/hypr/monitors.conf
source = ~/.config/hypr/env.conf
source = ~/.config/hypr/look.conf
source = ~/.config/hypr/input.conf
source = ~/.config/hypr/binds.conf
source = ~/.config/hypr/rules.conf
source = ~/.config/hypr/autostart.conf
# Last, so battery mode (scripts/ai-os-power) overrides look.conf.
source = ~/.config/ai-os/power.conf
