# Colours generated by scripts/ai-os-theme
source = ~/.config/ai-os/theme/hyprlock.conf

general {
    hide_cursor = true
}

background {
    monitor =
    color = $base
}

label {
    monitor =
    text = $TIME
    color = $mauve
    font_size = 72
    font_family = $font
    position = 0, 160
    halign = center
    valign = center
}

label {
    monitor =
    text = cmd[update:60000] date +"%A, %d %B"
    color = $text
    font_size = 18
    font_family = $font
    position = 0, 80
    halign = center
    valign = center
}

input-field {
    monitor =
    size = 300, 50
    outline_thickness = 2
    outer_color = $mauve
    inner_color = $surface0
    font_color = $text
    check_color = $mauve
    fail_color = $red
    font_family = $font
    placeholder_text = <i>Password</i>
    fail_text = <i>$FAIL ($ATTEMPTS)</i>
    rounding = 8
    fade_on_empty = false
    position = 0, -20
    halign = center
    valign = center
}
