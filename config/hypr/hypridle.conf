# Idle: dim -> lock -> screen off -> suspend. Power profile drops to
# power-saver while dimmed and is restored on activity.
general {
    lock_cmd = pidof hyprlock || hyprlock
    before_sleep_cmd = loginctl lock-session
    after_sleep_cmd = hyprctl dispatch dpms on
}

listener {
    timeout = 150
    # Laptops only (a backlight exists): desktops have nothing to dim and should keep their power profile.
    # The saved profile is never overwritten with power-saver, or a second dim would make it permanent.
    on-timeout = sh -c 'ls /sys/class/backlight/* >/dev/null 2>&1 || exit 0; brightnessctl -s set 10%; p=$(powerprofilesctl get); [ "$p" = power-saver ] || echo "$p" > /tmp/.ai-os-profile; powerprofilesctl set power-saver'
    on-resume = sh -c 'ls /sys/class/backlight/* >/dev/null 2>&1 || exit 0; brightnessctl -r; [ -s /tmp/.ai-os-profile ] && powerprofilesctl set "$(cat /tmp/.ai-os-profile)"'
}

listener {
    timeout = 300
    on-timeout = loginctl lock-session
}

listener {
    timeout = 330
    on-timeout = hyprctl dispatch dpms off
    on-resume = hyprctl dispatch dpms on
}

# Suspend only on machines with a battery. Desktops (e.g. the Ubuntu box on nouveau) stay up:
# resume from suspend on nouveau/Kepler can come back to a black screen.
listener {
    timeout = 900
    on-timeout = sh -c 'ls /sys/class/power_supply/BAT* >/dev/null 2>&1 && systemctl suspend'
}
