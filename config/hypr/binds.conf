$mod      = SUPER
$terminal = ghostty
$files    = nautilus
$browser  = google-chrome-stable
$launcher = fuzzel

# Apps
bind = $mod, RETURN, exec, $terminal
bind = $mod, SPACE, exec, $launcher
bind = $mod, F, exec, $files
bind = $mod, B, exec, $browser
bind = $mod, C, exec, ai-os-claude
bind = $mod, G, exec, $terminal -e lazygit
bind = $mod SHIFT, D, exec, $terminal -e lazydocker

# System menu (screenshot, update, lock, power)
bind = $mod, ESCAPE, exec, ai-os-menu

bind = $mod SHIFT, T, exec, ai-os-theme

# Windows
bind = $mod, W, killactive,
bind = $mod, T, togglefloating,
bind = $mod, P, pseudo,
bind = $mod, J, togglesplit,
bind = $mod, left, movefocus, l
bind = $mod, right, movefocus, r
bind = $mod, up, movefocus, u
bind = $mod, down, movefocus, d
bindm = $mod, mouse:272, movewindow
bindm = $mod, mouse:273, resizewindow

# Workspaces: SUPER+1..0, SUPER+SHIFT+1..0 moves the window
bind = $mod, 1, workspace, 1
bind = $mod, 2, workspace, 2
bind = $mod, 3, workspace, 3
bind = $mod, 4, workspace, 4
bind = $mod, 5, workspace, 5
bind = $mod, 6, workspace, 6
bind = $mod, 7, workspace, 7
bind = $mod, 8, workspace, 8
bind = $mod, 9, workspace, 9
bind = $mod, 0, workspace, 10
bind = $mod SHIFT, 1, movetoworkspace, 1
bind = $mod SHIFT, 2, movetoworkspace, 2
bind = $mod SHIFT, 3, movetoworkspace, 3
bind = $mod SHIFT, 4, movetoworkspace, 4
bind = $mod SHIFT, 5, movetoworkspace, 5
bind = $mod SHIFT, 6, movetoworkspace, 6
bind = $mod SHIFT, 7, movetoworkspace, 7
bind = $mod SHIFT, 8, movetoworkspace, 8
bind = $mod SHIFT, 9, movetoworkspace, 9
bind = $mod SHIFT, 0, movetoworkspace, 10
bind = $mod, mouse_down, workspace, e+1
bind = $mod, mouse_up, workspace, e-1

# Scratchpad
bind = $mod, S, togglespecialworkspace, scratch
bind = $mod SHIFT, S, movetoworkspace, special:scratch

# Screenshots: Print = region to clipboard, SHIFT = annotate (satty, else swappy), SUPER = whole output
bind = , Print, exec, ai-os-shot region
bind = SHIFT, Print, exec, ai-os-shot region annotate
bind = $mod, Print, exec, ai-os-shot output
bind = $mod SHIFT, Print, exec, ai-os-shot window
# Screenshot a region and hand it to the Claude scratchpad
bind = $mod SHIFT, A, exec, ai-os-shot-agent
# Dictation: press to start listening, press again to transcribe and type at the cursor
bind = $mod, D, exec, ai-os-dictate toggle
# Quick note into the Obsidian vault (Agent/Inbox.md); SHIFT adds the clipboard instead
bind = $mod, N, exec, ai-os-note
bind = $mod SHIFT, N, exec, ai-os-note --clip
# Displays: layout, scale, resolution for external monitors
bind = $mod SHIFT, M, exec, ai-os-display
# Clipboard history picker (cliphist)
bind = $mod CTRL, V, exec, sh -c 'cliphist list | fuzzel --dmenu | cliphist decode | wl-copy'

# Lock
bind = $mod, L, exec, loginctl lock-session

# Session: exit via uwsm (falls back to hyprctl)
bind = $mod SHIFT, E, exec, sh -c 'uwsm stop || hyprctl dispatch exit'

# Media keys (swayosd-client shows the OSD). bindel = works on lock screen + repeats, bindl = lock screen only.
bindel = , XF86AudioRaiseVolume, exec, swayosd-client --output-volume raise
bindel = , XF86AudioLowerVolume, exec, swayosd-client --output-volume lower
bindl = , XF86AudioMute, exec, swayosd-client --output-volume mute-toggle
bindl = , XF86AudioMicMute, exec, swayosd-client --input-volume mute-toggle
bindel = , XF86MonBrightnessUp, exec, swayosd-client --brightness raise
bindel = , XF86MonBrightnessDown, exec, swayosd-client --brightness lower
bindl = , XF86AudioNext, exec, playerctl next
bindl = , XF86AudioPause, exec, playerctl play-pause
bindl = , XF86AudioPlay, exec, playerctl play-pause
bindl = , XF86AudioPrev, exec, playerctl previous
