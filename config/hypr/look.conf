# Colours come from scripts/ai-os-theme; these defaults (Catppuccin Mocha) apply until a theme is set.
$ai_active1 = rgba(cba6f7ee)
$ai_active2 = rgba(b4befeee)
$ai_inactive = rgba(45475aaa)
source = ~/.config/ai-os/theme/hypr.conf

general {
    gaps_in = 6
    gaps_out = 12
    border_size = 1
    col.active_border = $ai_active1 $ai_active2 45deg
    col.inactive_border = $ai_inactive
    resize_on_border = true
    allow_tearing = false
    layout = dwindle
}

decoration {
    rounding = 12
    active_opacity = 1.0
    inactive_opacity = 0.96
    # macOS-style: large, soft, slightly offset shadow
    shadow {
        enabled = true
        range = 40
        render_power = 3
        color = rgba(00000055)
        offset = 0 12
    }
    # frosted-glass blur behind translucent windows
    blur {
        enabled = true
        size = 10
        passes = 3
        vibrancy = 0.2
        noise = 0.02
        brightness = 1.0
        contrast = 1.0
    }
}

# On battery, ~/.config/ai-os/power.conf (written by scripts/ai-os-power) turns blur, shadows and animations off.
animations {
    enabled = true
    bezier = easeOutQuint, 0.23, 1, 0.32, 1
    bezier = spring, 0.34, 1.35, 0.64, 1
    bezier = quick, 0.15, 0, 0.1, 1
    animation = global, 1, 10, easeOutQuint
    animation = windows, 1, 4, easeOutQuint, popin 85%
    animation = fade, 1, 3, quick
    animation = workspaces, 1, 4, spring, slide
}

dwindle {
    preserve_split = true
}

misc {
    force_default_wallpaper = 0
    disable_hyprland_logo = true
}
