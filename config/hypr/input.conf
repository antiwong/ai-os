input {
    kb_layout = us
    repeat_rate = 40
    repeat_delay = 300
    follow_mouse = 1
    sensitivity = 0
    touchpad {
        natural_scroll = true        # content follows fingers, like macOS
        tap-to-click = true
        clickfinger_behavior = true  # 2-finger click = right click, 3-finger = middle (Mac style)
        disable_while_typing = true  # palm rejection
        drag_lock = 1                # keep dragging after lifting a finger briefly
    }
}

gestures {
    workspace_swipe_distance = 400   # shorter, snappier workspace swipes
    workspace_swipe_cancel_ratio = 0.3
    workspace_swipe_create_new = false
}

# Trackpad gestures (macOS-like)
gesture = 3, horizontal, workspace                      # swipe between desktops
gesture = 3, up, dispatcher, exec, fuzzel               # Spotlight/Launchpad
gesture = 4, up, dispatcher, exec, ai-os-claude         # Claude scratchpad
gesture = 4, down, dispatcher, exec, ai-os-menu         # system menu
gesture = 3, swipe, mod: SUPER, move                    # hold SUPER + 3 fingers: move window
gesture = 4, swipe, mod: SUPER, resize                  # hold SUPER + 4 fingers: resize window
