env = XCURSOR_SIZE,24
env = HYPRCURSOR_SIZE,24
# Wayland hints for toolkits/Electron apps (Chrome, Obsidian, VS Code)
env = ELECTRON_OZONE_PLATFORM_HINT,auto
env = QT_QPA_PLATFORM,wayland;xcb
env = QT_WAYLAND_DISABLE_WINDOWDECORATION,1
env = GDK_BACKEND,wayland,x11
env = MOZ_ENABLE_WAYLAND,1
# QT_QPA_PLATFORMTHEME, NVIDIA vars and DOCKER_HOST (rootless podman socket) need shell logic, so they live in
# config/uwsm/env-hyprland (linked to ~/.config/uwsm/env-hyprland), which uwsm sources before starting Hyprland.
# ai-os-* commands live in ~/.local/bin. The plain "Hyprland" login session (start-hyprland) does not read
# ~/.profile, so without this every ai-os bind and autostart entry fails with "not found".
# Guarded by a marker variable: env lines run again on every config reload, which would grow PATH each time.
# hyprlang if !AI_OS_PATH_SET
env = PATH,$HOME/.local/bin:$PATH
env = AI_OS_PATH_SET,1
# hyprlang endif
