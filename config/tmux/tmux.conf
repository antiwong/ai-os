# ai-os tmux: one pane per agent. Prefix is Ctrl+A (press twice to send a literal Ctrl+A to the shell).
unbind C-b
set -g prefix C-a
bind C-a send-prefix

# Terminal (ghostty): truecolor, clipboard, passthrough, focus events
set -g default-terminal "tmux-256color"
set -as terminal-features ",xterm-ghostty:RGB:clipboard:hyperlinks:extkeys"
set -g allow-passthrough on
set -g extended-keys on
set -g focus-events on
set -g set-clipboard on

# Sanity
set -g mouse on
set -g escape-time 0
set -g history-limit 50000
set -g base-index 1
setw -g pane-base-index 1
set -g renumber-windows on
set -g mode-keys vi
set -g detach-on-destroy off

# Panes and windows (new ones keep the current directory)
bind | split-window -h -c "#{pane_current_path}"
bind - split-window -v -c "#{pane_current_path}"
bind c new-window -c "#{pane_current_path}"
bind -n M-h select-pane -L
bind -n M-j select-pane -D
bind -n M-k select-pane -U
bind -n M-l select-pane -R
bind -n M-1 select-window -t 1
bind -n M-2 select-window -t 2
bind -n M-3 select-window -t 3
bind -n M-4 select-window -t 4
bind z resize-pane -Z
bind r source-file ~/.config/tmux/tmux.conf \; display "reloaded"

# Copy mode like vi
bind -T copy-mode-vi v send -X begin-selection
bind -T copy-mode-vi y send -X copy-selection-and-cancel

# Agent layouts: prefix+A = main pane + 2 agent panes, prefix+L cycles layouts
bind A run-shell "ai-os-agents here 2"
bind L next-layout
setw -g main-pane-width 60%

# Pane titles show which agent lives where
set -g pane-border-status top
set -g pane-border-format " #{?pane_title,#{pane_title},#{pane_current_command}} "
set -g allow-rename off
set -g automatic-rename on

# Status bar
set -g status-position bottom
set -g status-interval 5
set -g status-left-length 40
set -g status-left " #S "
set -g status-right " #{pane_current_path} "
set -g status-right-length 80
set -g window-status-format " #I:#W "
set -g window-status-current-format " #I:#W "

# Colours come from scripts/ai-os-theme (falls back to tmux defaults)
source-file -q ~/.config/ai-os/theme/tmux.conf
